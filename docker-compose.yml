services:
  accounting-db:
    image: postgres:18-alpine
    container_name: accounting-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=accounting_db
    ports:
      - "5432:5432"
    volumes:
      - accounting_postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - accounting-network

  accounting-api:
    build:
      context: ./accounting-api
      dockerfile: Dockerfile
    container_name: accounting-api
    ports:
      - "5010:5010"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5010
      - ConnectionStrings__PostgresConnection=Host=accounting-db;Port=5432;Database=accounting_db;Username=postgres;Password=postgres
    depends_on:
      accounting-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - accounting-network

  accounting-web:
    build:
      context: ./accounting-web
      dockerfile: Dockerfile
    container_name: accounting-web
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5010
    depends_on:
      - accounting-api
    restart: unless-stopped
    networks:
      - accounting-network

volumes:
  accounting_postgres_data:

networks:
  accounting-network:
    driver: bridge

